<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Health-Net — Historial Clínico</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><img src="assets/images/logo.png" class="logo-sidebar"><h2>Health-Net</h2></div>
      <div class="user-card">
        <img id="sidePhoto_hist" src="assets/images/admin.png" class="user-photo">
        <div class="user-info"><div id="sideName_hist">Usuario</div><div id="sideRole_hist">Rol</div></div>
      </div>
      <nav class="menu"><button onclick="location.href='inicio.html'" class="menu-btn">Inicio</button></nav>
      <div class="sidebar-footer"><button id="logoutBtn_hist" class="btn danger">Cerrar sesión</button></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h3>Historial Clínico</h3>
        <div style="margin-left:auto">
          <button id="exportCsvBtn" class="btn export-csv">📤 Exportar Historial (CSV)</button>
        </div>
      </header>

      <section class="content container">
        <div id="histList" class="grid-list"></div>

        <div class="mt-16 text-center">
          <button class="btn neutral" onclick="location.href='inicio.html'">Volver</button>
        </div>
      </section>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
