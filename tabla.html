<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Health-Net — Tabla General</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><img src="assets/images/logo.png" class="logo-sidebar"><h2>Health-Net</h2></div>
      <div class="user-card">
        <img id="sidePhoto_tab" src="assets/images/admin.png" class="user-photo">
        <div class="user-info"><div id="sideName_tab">Usuario</div><div id="sideRole_tab">Rol</div></div>
      </div>
      <nav class="menu"><button onclick="location.href='inicio.html'" class="menu-btn">Inicio</button></nav>
      <div class="sidebar-footer"><button id="logoutBtn_tab" class="btn danger">Cerrar sesión</button></div>
    </aside>

    <div class="main">
      <header class="topbar"><h3>Tabla General</h3><p class="muted">Edición y eliminación (solo admin)</p></header>

      <section class="content container">
        <div class="card">
          <table id="tblGeneral" class="table">
            <thead>
              <tr><th>ID</th><th>Paciente</th><th>Doctor</th><th>Diagnóstico</th><th>Fibromas</th><th>Tipo</th><th>Confianza</th><th>Imagen</th><th>Acciones</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="mt-16 text-center">
          <button class="btn neutral" onclick="location.href='inicio.html'">Volver</button>
        </div>
      </section>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
